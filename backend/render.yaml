services:
  - type: web
    name: cairn-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cairn-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGIN
        value: https://frontend-xi-one-69.vercel.app
      - key: FRONTEND_URL
        value: https://frontend-xi-one-69.vercel.app

databases:
  - name: cairn-db
    plan: free
